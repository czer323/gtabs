name: Dependency Update
description: Update a dependency to its latest version, verify compatibility, and commit or document breakage
labels: ["chore", "deps"]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Package name as it appears in package.json
      placeholder: "e.g. vitest"
    validations:
      required: true

  - type: input
    id: current-version
    attributes:
      label: Current Version
      description: Version currently declared in package.json
      placeholder: "e.g. 2.1.0"
    validations:
      required: true

  - type: input
    id: target-version
    attributes:
      label: Target Version
      description: Version to update to (use `latest` for the most recent published version)
      placeholder: "e.g. latest"
    validations:
      required: true

  - type: textarea
    id: agent-instructions
    attributes:
      label: Agent Instructions
      description: Process the executing agent MUST follow. Do not deviate.
      value: |
        ## Goal
        Update the package to the target version and verify the project still works.

        ## Steps

        1. **Update** — Run `npm install <package>@<target-version>` (or `npm install -D <package>@<target-version>` for devDependencies) in the project root. Verify package.json and package-lock.json reflect the change.
        2. **Test** — Run `npm run check` (or `npm test && npm run lint && npm run format:check && npm run typecheck` if check is not available). Record the full output.
        3. **Evaluate** — Did `npm run check` exit 0?
           - **Yes (clean pass)** → Commit with message `chore(deps): update <package> from <current> to <new-version>`. Only commit package.json and package-lock.json. Push. Close this issue with a comment containing the commit hash.
           - **No (failure)** → Investigate the failure. Read changelog/release notes for breaking changes between the current and target version. Document specifically:
             * What failed (error output)
             * Breaking changes identified (with links to migration guides if available)
             * Whether the breaking change affects this project
           Do NOT modify source code to fix breakage. Update this issue with the research findings. Stop.

        ## Agent Boundary (do not cross)
        - Do NOT modify any source files (src/, test/, config files other than package.json/lock).
        - Do NOT update any package other than the one specified.
        - Do NOT attempt to work around breaking changes by changing imports, types, or logic.
        - If tests fail OR lint/format/typecheck fails, stop and research — do not attempt to fix.
        - If you cannot determine the breaking change, say so explicitly.
    validations:
      required: false

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Filled by the executing agent on completion
      placeholder: |
        - [ ] Updated <package> from <current> to <installed-version>
        - [ ] `npm run check` passed / failed
        - [ ] Commit: <hash> (if clean pass)
        - [ ] Breaking changes documented (if any)
      render: markdown
    validations:
      required: false
