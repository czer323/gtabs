name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format:check
        run: npm run format:check

      # E2E is an explicit CI gate (issue #72), deliberately separate from
      # `npm run check` / the unit gate. playwright.config.ts launches with
      # channel: "chromium" (Chromium new-headless), which `playwright install
      # chromium` provides; --with-deps installs the runner's system libraries.
      # --no-sandbox is already set in the config's launchOptions. The e2e
      # script itself runs `npm run build` first, so dist/ is always fresh.
      - name: e2e (smoke)
        run: npx playwright install --with-deps chromium && npm run test:e2e
