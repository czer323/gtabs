name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format:check
        run: npm run format:check
